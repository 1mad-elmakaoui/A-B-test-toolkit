version: 2

models:
  - name: stg_checkout_experiment
    description: Typed raw experiment data, one row per user.
    columns:
      - name: user_id
        data_tests: [unique, not_null]
      - name: variant
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["control", "treatment"]
      - name: assignment_date
        data_tests: [not_null]
      - name: device
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["mobile", "desktop", "tablet"]
      - name: pre_period_orders
        data_tests: [not_null]
      - name: converted
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [0, 1]
                quote: false
      - name: revenue
        data_tests: [not_null]
